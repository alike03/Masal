# Builds a signed APK and publishes a GitHub release when a version tag (v1.2.3) is pushed.
# Run it by hand (Actions > Release > Run workflow) for a dry run: it tests and builds, but creates no release.
# Needs the repository secrets from scripts/create-release-key.sh.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      # Actions are pinned to commit SHAs (tags can be moved); the comment names the version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: the version code is the number of commits

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Test
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MASAL_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret MASAL_KEYSTORE_BASE64 is missing. Run scripts/create-release-key.sh once."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "MASAL_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # Release notes: the version's section of CHANGELOG.md (a dry run checks "Unreleased").
      # A tag without its section fails here, before anything is built.
      - name: Release notes from CHANGELOG.md
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then section="${GITHUB_REF_NAME#v}"; else section="Unreleased"; fi
          awk -v s="$section" '
            index($0, "## [" s "]") == 1 { on = 1; next }
            on && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            on { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > "$RUNNER_TEMP/notes.md"
          if [[ "$section" != "Unreleased" ]] && ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no entries under '## [$section]'"; exit 1
          fi
          cat "$RUNNER_TEMP/notes.md"

      - name: Build signed APK
        env:
          MASAL_KEYSTORE_PASSWORD: ${{ secrets.MASAL_KEYSTORE_PASSWORD }}
          MASAL_KEY_ALIAS: ${{ secrets.MASAL_KEY_ALIAS }}
          MASAL_KEY_PASSWORD: ${{ secrets.MASAL_KEY_PASSWORD }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; else version="0.0.0-dev.$GITHUB_RUN_NUMBER"; fi
          export MASAL_VERSION_NAME="$version" MASAL_VERSION_CODE="$(git rev-list --count HEAD)"
          ./gradlew assembleRelease --console=plain
          apk="masal-$version.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          "$ANDROID_HOME"/build-tools/35.0.0/apksigner verify --print-certs "$apk" | grep -q "CN=Masal"
          echo "APK=$apk" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Keep the APK of a dry run
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.APK }}
          path: ${{ env.APK }}
          retention-days: 7

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          [[ "$VERSION" == *-* ]] && prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" "$APK" --title "Masal $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes --verify-tag $prerelease
